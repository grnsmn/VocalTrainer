name: Release Android

# Avvio solo manuale, di proposito: in questa fase si verifica che la CI
# riproduca esattamente il risultato di una release fatta a mano, senza che
# un merge possa far partire una pubblicazione a sorpresa.
# Il trigger su tag `v*` arriva in un secondo momento.
on:
    workflow_dispatch:
        inputs:
            submit:
                description: 'Invia a Google Play dopo la build (track alpha / closed testing)'
                type: boolean
                default: true

# Due release in parallelo si contenderebbero lo stesso versionCode.
# Non si cancella la run in corso: potrebbe essere gia' in submit.
concurrency:
    group: release-android
    cancel-in-progress: false

jobs:
    release:
        name: Build e submit Android
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Fallire subito con un messaggio chiaro, invece che a metà
            # build con un errore di autenticazione EAS.
            - name: Verifica i secret richiesti
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
              run: |
                  if [ -z "$EXPO_TOKEN" ]; then
                    echo "::error::Secret EXPO_TOKEN mancante. Crearlo su expo.dev (Account settings > Access tokens) e aggiungerlo ai secret del repository."
                    exit 1
                  fi
                  echo "EXPO_TOKEN presente."

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Setup EAS
              uses: expo/expo-github-action@v8
              with:
                  eas-version: latest
                  token: ${{ secrets.EXPO_TOKEN }}

            # npm ci rispetta .npmrc (legacy-peer-deps=true).
            - name: Installa le dipendenze
              run: npm ci

            # Le variabili Firebase NON servono qui: le legge EAS Build dal
            # proprio environment `production` (vedi `environment` in eas.json).
            # L'unico secret necessario a questo workflow e' EXPO_TOKEN.
            #
            # versionCode e firma sono gestiti da EAS: autoIncrement sul
            # contatore remoto, e il keystore gia' registrato come upload key
            # su Play App Signing.
            - name: Build su EAS
              if: ${{ !inputs.submit }}
              run: eas build --platform android --profile production --non-interactive

            - name: Build e submit su EAS
              if: ${{ inputs.submit }}
              run: eas build --platform android --profile production --non-interactive --auto-submit
