name: EAS Build & Submit
on:
    push:
        branches:
            - master
            - dev
            - features/eas-workflow

permissions:
    contents: write

jobs:
    build:
        name: Install and Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24.x
                  cache: npm

            - name: Setup Git User
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Setup Expo
              uses: expo/expo-github-action@v8
              with:
                  token: ${{ secrets.EXPO_TOKEN }}
                  eas-version: latest

            - name: Install dependencies
              run: npm ci

            - name: Create .env file
              run: |
                echo "API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env
                echo "AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}" >> .env
                echo "DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}" >> .env
                echo "PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env
                echo "STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}" >> .env
                echo "MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" >> .env
                echo "APP_ID=${{ secrets.FIREBASE_APP_ID }}" >> .env
                echo "MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}" >> .env
                echo "STORAGE_PATH=${{ secrets.FIREBASE_STORAGE_PATH }}" >> .env
                echo "CATEGORY_LIST=${{ secrets.FIREBASE_CATEGORY_LIST }}" >> .env

            - name: Release Version
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if [[ "${{ github.ref_name }}" == "master" ]]; then
                    npm run release -- --ci
                  else
                    npm run release -- --ci --prerelease=dev
                  fi

            - name: Calculate and Apply Version Code
              run: |
                  # Use total git commit count + github run number + offset for guaranteed uniqueness
                  COMMIT_COUNT=$(git rev-list --count HEAD)
                  NEW_CODE=$((COMMIT_COUNT + ${{ github.run_number }} + 6000))
                  echo "Calculated versionCode: $NEW_CODE"

                  # Update versionCode in app.json using Node.js
                  node -e "
                    const fs = require('fs');
                    const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
                    app.expo.android.versionCode = $NEW_CODE;
                    fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
                  "

                  echo "Final app.json before build:"
                  cat app.json

            - name: Create Service Account JSON
              env:
                  GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
              run: echo "$GOOGLE_SERVICE_ACCOUNT" > google-services-key.json

            - name: Build Android App Bundle
              run: eas build --platform android --profile production --non-interactive --local

            - name: Find Build Artifact
              id: find_build
              run: |
                # Find the most recent .aab file generated by EAS
                BUILD_PATH=$(ls -t build-*.aab | head -n 1)
                if [ -z "$BUILD_PATH" ]; then
                  echo "Error: No .aab file found!"
                  exit 1
                fi
                echo "Found build at: $BUILD_PATH"
                echo "path=$BUILD_PATH" >> $GITHUB_OUTPUT

            - name: Submit to Google Play
              run: eas submit --platform android --profile production --path ${{ steps.find_build.outputs.path }} --non-interactive
