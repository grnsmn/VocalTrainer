name: Deploy to Production

# Si attiva su push al branch master
on:
    push:
        branches:
            - 'master'

jobs:
    # Step 1: Calcola fingerprint delle parti native
    fingerprint:
        name: Calculate Fingerprint
        type: fingerprint
        environment: production

    # Step 2: Verifica se esiste già una build Android con questo fingerprint
    get_android_build:
        name: Check Android Build
        needs: [fingerprint]
        type: get-build
        params:
            fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
            profile: production

    # Step 3: Verifica se esiste già una build iOS con questo fingerprint
    get_ios_build:
        name: Check iOS Build
        needs: [fingerprint]
        type: get-build
        params:
            fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
            profile: production

    # Step 4a: Se NON esiste build Android, creala
    build_android:
        name: Build Android
        needs: [get_android_build]
        if: ${{ !needs.get_android_build.outputs.build_id }}
        type: build
        params:
            platform: android
            profile: production

    # Step 4b: Se NON esiste build iOS, creala
    build_ios:
        name: Build iOS
        needs: [get_ios_build]
        if: ${{ !needs.get_ios_build.outputs.build_id }}
        type: build
        params:
            platform: ios
            profile: production

    # Step 5a: Submit nuova build Android allo store
    submit_android:
        name: Submit Android to Store
        needs: [build_android]
        type: submit
        params:
            build_id: ${{ needs.build_android.outputs.build_id }}

    # Step 5b: Submit nuova build iOS allo store
    submit_ios:
        name: Submit iOS to Store
        needs: [build_ios]
        type: submit
        params:
            build_id: ${{ needs.build_ios.outputs.build_id }}

    # Step 4c: Se ESISTE già build Android, fai solo OTA update
    update_android:
        name: OTA Update Android
        needs: [get_android_build]
        if: ${{ needs.get_android_build.outputs.build_id }}
        type: update
        params:
            platform: android
            channel: production

    # Step 4d: Se ESISTE già build iOS, fai solo OTA update
    update_ios:
        name: OTA Update iOS
        needs: [get_ios_build]
        if: ${{ needs.get_ios_build.outputs.build_id }}
        type: update
        params:
            platform: ios
            channel: production
