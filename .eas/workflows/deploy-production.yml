name: Deploy to Production

# Triggers on push to master branch
on:
    push:
        branches:
            - 'master'

jobs:
    # Step 1: Calculate fingerprint of native parts
    fingerprint:
        name: Calculate Fingerprint
        type: fingerprint
        environment: production

    # Step 2: Check if Android build with this fingerprint exists
    get_android_build:
        name: Check Android Build
        needs: [fingerprint]
        type: get-build
        params:
            fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
            profile: production

    # Step 3: Check if iOS build with this fingerprint exists
    get_ios_build:
        name: Check iOS Build
        needs: [fingerprint]
        type: get-build
        params:
            fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
            profile: production

    # Step 4a: If Android build does NOT exist, create it
    build_android:
        name: Build Android
        needs: [get_android_build]
        if: ${{ !needs.get_android_build.outputs.build_id }}
        type: build
        params:
            platform: android
            profile: production

    # Step 4b: If iOS build does NOT exist, create it
    build_ios:
        name: Build iOS
        needs: [get_ios_build]
        if: ${{ !needs.get_ios_build.outputs.build_id }}
        type: build
        params:
            platform: ios
            profile: production

    # Step 5a: Submit new Android build to store
    submit_android:
        name: Submit Android to Store
        needs: [build_android]
        type: submit
        params:
            build_id: ${{ needs.build_android.outputs.build_id }}

    # Step 5b: Submit new iOS build to store
    submit_ios:
        name: Submit iOS to Store
        needs: [build_ios]
        type: submit
        params:
            build_id: ${{ needs.build_ios.outputs.build_id }}

    # Step 4c: If Android build EXISTS, do OTA update only
    update_android:
        name: OTA Update Android
        needs: [get_android_build]
        if: ${{ needs.get_android_build.outputs.build_id }}
        type: update
        params:
            platform: android
            channel: production

    # Step 4d: If iOS build EXISTS, do OTA update only
    update_ios:
        name: OTA Update iOS
        needs: [get_ios_build]
        if: ${{ needs.get_ios_build.outputs.build_id }}
        type: update
        params:
            platform: ios
            channel: production
