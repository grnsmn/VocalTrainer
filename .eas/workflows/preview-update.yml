name: Preview Update on Feature Branch

# Si attiva su ogni push ai branch features/* o feature/*
on:
    push:
        branches:
            - 'features/**'
            - 'feature/**'

jobs:
    publish_update:
        name: Publish Preview Update
        type: update
        params:
            # Usa il nome del branch come branch dell'update
            # Es: features/new-exercise → update branch "features/new-exercise"
            branch: ${{ github.ref_name }}
            message: '${{ github.ref_name }}: ${{ github.event.head_commit.message }}'
